name: ci

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs this before publishing.
  workflow_call:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (gemspec required_ruby_version) and the latest stable release.
        ruby: ['3.0', ruby]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rake test
      # Smoke from artifact: `gem build --strict` (any gemspec warning fails), only lib/ + README/LICENSE/CHANGELOG
      # in the .gem, install it with --install-dir into an empty dir, run the README "Testing" example against the mock.
      - run: ruby test/smoke_artifact.rb
