AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "docs/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 130

Style/Documentation:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 35
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  Exclude:
    - "test/**/*"

Metrics/ParameterLists:
  CountKeywordArgs: false

# The API methods return `true` by contract (close, ban, next, set_webhook_url, ...).
Naming/PredicateMethod:
  Enabled: false

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Naming/VariableNumber:
  Exclude:
    - "test/**/*"
